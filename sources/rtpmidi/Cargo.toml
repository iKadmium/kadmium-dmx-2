[package]
name = "rtpmidi-source"
version = "0.1.0"
edition = "2024"

[dependencies]
kadmium-dmx-shared = { path = "../../shared/rust" }
midi-types = "0.2.1"
rtpmidi = { version = "0.4.4", features = ["mdns"] }
rumqttc = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.141"
tokio = { version = "1.47.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
